<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f8" />
  <title>Purpose - スマホを開く前に、目的を。</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="badge">Purpose</div>

      <h1>何のために<br />スマホを使いますか？</h1>
      <p class="description">
        目的を一度言葉にしてから、スマホを使い始めましょう。
      </p>

      <p id="appName" class="app-name"></p>

      <form id="purposeForm">
        <label for="purposeInput">使用目的</label>
        <textarea
          id="purposeInput"
          name="purpose"
          rows="4"
          maxlength="100"
          placeholder="例：履修登録をするため"
          required
        ></textarea>

        <div class="input-meta">
          <span>100文字以内</span>
          <span id="charCount">0 / 100</span>
        </div>

        <button type="submit" class="primary-button">
          目的を確認する
        </button>
      </form>

      <section id="resultSection" class="result hidden" aria-live="polite">
        <p class="result-label">AIの判定</p>
        <h2 id="categoryText"></h2>
        <p id="messageText" class="message"></p>

        <button id="continueButton" class="secondary-button">
          この目的で使用する
        </button>
      </section>
    </section>

    <section class="history-card">
      <div class="history-heading">
        <h2>今日の記録</h2>
        <button id="clearHistoryButton" class="text-button">リセット</button>
      </div>

      <div class="stats">
        <div>
          <span id="totalCount" class="stat-number">0</span>
          <span class="stat-label">回</span>
        </div>
        <div>
          <span id="aimlessCount" class="stat-number">0</span>
          <span class="stat-label">無目的</span>
        </div>
      </div>

      <ul id="historyList" class="history-list"></ul>
      <p id="emptyHistory" class="empty-history">まだ記録がありません。</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
